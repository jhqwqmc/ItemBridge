customcrafting-wolfyutilities = "4.19.1.2"
itemedit = "2.17"

[libraries]
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
platform-paper-j21 = { module = "io.papermc.paper:paper-api", version.ref = "paper-j21" }
platform-spigot-j8 = { module = "org.spigotmc:spigot-api", version.ref = "spigot-j8" }
hook-customfishing = { module = "net.momirealms:custom-fishing", version.ref = "customfishing" }
hook-craftengine-core = { module = "net.momirealms:craft-engine-core", version.ref = "craftengine" }
hook-craftengine-bukkit = { module = "net.momirealms:craft-engine-bukkit", version.ref = "craftengine" }
hook-craftengine-core-legacy = { module = "net.momirealms:craft-engine-core", version.ref = "craftengine-legacy" }
hook-craftengine-bukkit-legacy = { module = "net.momirealms:craft-engine-bukkit", version.ref = "craftengine-legacy" }
hook-itemsadder = { module = "dev.lone:api-itemsadder", version.ref = "itemsadder" }
hook-nexo = { module = "com.nexomc:nexo", version.ref = "nexo" }
hook-mmoitems-api = { module = "net.Indyuce:MMOItems-API", version.ref = "mmoitems-api" }
hook-mmoitems-lib = { module = "io.lumine:MythicLib-dist", version.ref = "mmoitems-lib" }
hook-mythicmobs = { module = "io.lumine:Mythic-Dist", version.ref = "mythicmobs" }
hook-neigeitems = { module = "pers.neige.neigeitems:NeigeItems", version.ref = "neigeitems" }
hook-sxitem = { module = "com.github.Saukiya:SX-Item", version.ref = "sxitem" }
hook-slimefun = { module = "io.github.Slimefun:Slimefun4", version.ref = "slimefun" }
hook-headdatabase = { module = "com.arcaniax:HeadDatabase-API", version.ref = "headdatabase" }
hook-oraxen = { module = "io.th0rgal:oraxen", version.ref = "oraxen" }
hook-nova = { module = "xyz.xenondevs.nova:nova-api", version.ref = "nova" }
hook-eco = { module = "com.willfp:eco", version.ref = "eco" }
hook-baikiruto = { module = "org.tabooproject.baikiruto:Baikiruto", version.ref = "baikiruto" }
hook-crazyvouchers = { module = "com.badbones69.crazyvouchers:crazyvouchers-paper-api", version.ref = "crazyvouchers" }
hook-score = { module = "com.github.Ssomar-Developement:SCore", version.ref = "score" }
hook-itemxl = { module = "de.erethon:caliburn", version.ref = "itemxl" }
hook-advanceditems = { module = "net.advancedplugins:advanceditems", version.ref = "advanceditems" }
hook-customcrafting = { module = "com.wolfyscript.customcrafting:customcrafting-spigot", version.ref = "customcrafting" }
hook-customcrafting-wolfyutilities = { module = "com.wolfyscript.wolfyutils.spigot:wolfyutils-spigot", version.ref = "customcrafting-wolfyutilities" }
hook-itemedit = { module = "com.github.emanondev:ItemEdit", version.ref = "itemedit" }

[bundles]
hooks = [
    "hook-itemsadder",
    "hook-neigeitems",
    "hook-sxitem",
    "hook-slimefun",
    "hook-headdatabase",
    "hook-baikiruto",
    "hook-mmoitems-api",
    "hook-mmoitems-lib",
    "hook-customfishing",
    "hook-craftengine-core",
    "hook-craftengine-bukkit",
    "hook-nexo",
    "hook-oraxen",
    "hook-nova",
    "hook-mythicmobs",
    "hook-eco",
    "hook-crazyvouchers",
    "hook-score",
    "hook-itemxl",
    "hook-advanceditems",
    "hook-customcrafting",
    "hook-customcrafting-wolfyutilities",
    "hook-itemedit",
]

hooks-legacy = [
    "hook-craftengine-core-legacy",
    "hook-craftengine-bukkit-legacy",
]
