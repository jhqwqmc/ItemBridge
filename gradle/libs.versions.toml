customfishing = "2.3.7"
craftengine = "26.5-SNAPSHOT"
craftengine-legacy = "0.0.67"
itemsadder = "4.0.10"
nexo = "1.16.1"
mmoitems-api = "6.10.1-SNAPSHOT"
mmoitems-lib = "1.7.1-SNAPSHOT"
